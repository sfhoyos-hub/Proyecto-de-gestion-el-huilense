<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bonificaciones | El Huilense</title>

    <!-- Bootstrap 5.3 CSS e Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/alertas.css">
</head>
<body class="bg-unity-layout">

    <!-- Header y menú lateral: los pinta js/ui/layout.js -->
    <header id="layout-cabecera"></header>

    <div class="container-fluid px-4 main-content-wrapper">
        <div class="row g-4">

            <aside id="layout-sidebar"></aside>

            <main class="col-lg-9 col-xl-10">
                <!-- BANNER DE ENCABEZADO -->
                <div class="unity-welcome-card bg-white p-4 rounded-4 shadow-sm border-0 mb-4 d-flex align-items-center justify-content-between flex-wrap gap-3">
                    <div>
                        <h3 class="font-serif fw-bold text-huilense mb-1">Bonificaciones</h3>
                        <p class="text-muted mb-0 small">Genera las bonificaciones del domingo y consulta lo entregado a cada mesero.</p>
                    </div>
                </div>

                <!-- GENERAR Y CONSULTAR BONIFICACIONES -->
                <div class="bg-white p-4 rounded-4 shadow-sm border-0 mb-4">
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="bonificaciones-fecha" class="form-label">
                                Fecha del domingo
                            </label>
                            <input type="date" id="bonificaciones-fecha" class="form-control" required>
                        </div>
                        <div class="col-md-8 d-flex align-items-end gap-2 flex-wrap">
                            <button type="button" id="btn-consultar-bonos" class="btn btn-outline-success">
                                Consultar bonificaciones
                            </button>
                            <button type="button" id="btn-generar-bonos" class="btn btn-success">
                                Generar bonificaciones
                            </button>
                        </div>
                    </div>

                    <div id="tabla-bonificaciones-contenedor" class="table-responsive" style="display: none;">
                        <h6 class="fw-bold">Bonificaciones del domingo</h6>
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Mesero</th>
                                    <th>Puesto</th>
                                    <th>Monto</th>
                                    <th>Fecha de entrega</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-bonificaciones-cuerpo"></tbody>
                        </table>
                        <p id="total-bonificaciones" class="fw-bold text-huilense text-end mb-0"></p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui/alertas.js"></script>
    <script src="../js/ui/dom.js"></script>
    <script src="../js/ui/layout.js"></script>
    <script src="../js/paginas/bonificaciones.js"></script>
</body>
</html>
