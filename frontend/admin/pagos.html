<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pagos | El Huilense</title>

    <!-- Bootstrap 5.3 CSS e Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/alertas.css">
</head>
<body class="bg-unity-layout">

    <!-- Header y menú lateral: los pinta js/ui/layout.js -->
    <header id="layout-cabecera"></header>

    <div class="container-fluid px-4 main-content-wrapper">
        <div class="row g-4">

            <aside id="layout-sidebar"></aside>

            <main class="col-lg-9 col-xl-10">
                <!-- BANNER DE ENCABEZADO -->
                <div class="unity-welcome-card bg-white p-4 rounded-4 shadow-sm border-0 mb-4 d-flex align-items-center justify-content-between flex-wrap gap-3">
                    <div>
                        <h3 class="font-serif fw-bold text-huilense mb-1">Pagos por Nequi</h3>
                        <p class="text-muted mb-0 small">Paga las bonificaciones del Top 6 directamente a la cuenta Nequi de cada mesero.</p>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-4 shadow-sm border-0 mb-4">
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="pagos-fecha" class="form-label">Fecha del domingo</label>
                            <input type="date" id="pagos-fecha" class="form-control" required>
                        </div>
                        <div class="col-md-8 d-flex align-items-end">
                            <button type="button" id="btn-pagos-consultar" class="btn btn-outline-huilense">Ver bonificaciones</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <h6 class="fw-bold">Bonificaciones del domingo</h6>
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>Puesto</th><th>Mesero</th><th>Monto</th><th>Estado</th><th>Acción</th></tr>
                            </thead>
                            <tbody id="pagos-bonificaciones"><tr><td colspan="5" class="text-center py-3 text-muted">Sin datos.</td></tr></tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-4 shadow-sm border-0 mb-4">
                    <h6 class="fw-bold">Cuenta Nequi de un mesero</h6>
                    <form id="form-cuenta" class="row g-3" novalidate>
                        <div class="col-md-4">
                            <label for="cuenta-mesero" class="form-label">Mesero</label>
                            <select id="cuenta-mesero" class="form-select" required></select>
                        </div>
                        <div class="col-md-4">
                            <label for="cuenta-numero" class="form-label">Celular Nequi</label>
                            <input type="tel" id="cuenta-numero" class="form-control" inputmode="numeric" maxlength="10" placeholder="3001234567" required>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-huilense">Guardar cuenta</button>
                        </div>
                    </form>
                </div>

                <div class="bg-white p-4 rounded-4 shadow-sm border-0 mb-4">
                    <div class="table-responsive">
                        <h6 class="fw-bold">Historial de solicitudes de pago</h6>
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>Domingo</th><th>Mesero</th><th>Monto</th><th>Estado</th><th>Detalle</th></tr>
                            </thead>
                            <tbody id="pagos-solicitudes"><tr><td colspan="5" class="text-center py-3 text-muted">Sin datos.</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui/alertas.js"></script>
    <script src="../js/ui/dom.js"></script>
    <script src="../js/ui/layout.js"></script>
    <script src="../js/paginas/pagos.js"></script>
</body>
</html>
