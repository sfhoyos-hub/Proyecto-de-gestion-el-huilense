<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reportes | El Huilense</title>

    <!-- Bootstrap 5.3 CSS e Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/alertas.css">
</head>
<body class="bg-unity-layout">

    <!-- Header y menú lateral: los pinta js/ui/layout.js -->
    <header id="layout-cabecera"></header>

    <div class="container-fluid px-4 main-content-wrapper">
        <div class="row g-4">

            <aside id="layout-sidebar"></aside>

            <main class="col-lg-9 col-xl-10">
                <!-- BANNER DE ENCABEZADO -->
                <div class="unity-welcome-card bg-white p-4 rounded-4 shadow-sm border-0 mb-4 d-flex align-items-center justify-content-between flex-wrap gap-3">
                    <div>
                        <h3 class="font-serif fw-bold text-huilense mb-1">Reportes e Historial</h3>
                        <p class="text-muted mb-0 small">Resumen de desempeño por mesero en un rango de fechas y su historial domingo a domingo.</p>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-4 shadow-sm border-0 mb-4">
                    <form id="form-reporte" class="row g-3 mb-4" novalidate>
                        <div class="col-md-4">
                            <label for="rep-desde" class="form-label">Desde</label>
                            <input type="date" id="rep-desde" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label for="rep-hasta" class="form-label">Hasta</label>
                            <input type="date" id="rep-hasta" class="form-control" required>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-huilense">Generar reporte</button>
                        </div>
                    </form>
                    <p id="rep-totales" class="fw-semibold"></p>
                    <div class="table-responsive">
                        
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>Mesero</th><th>Domingos</th><th>Total vendido</th><th>Veces Top 6</th><th>Mejor puesto</th><th>Bonificaciones</th><th>Racha</th><th>Historial</th></tr>
                            </thead>
                            <tbody id="rep-resumen"><tr><td colspan="8" class="text-center py-3 text-muted">Sin datos.</td></tr></tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-4 shadow-sm border-0 mb-4">
                    <h6 class="fw-bold" id="rep-historial-titulo">Historial</h6>
                    <div class="table-responsive">
                        
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>Fecha</th><th>Vendido</th><th>Puesto</th><th>Top 6</th><th>Bonificación</th></tr>
                            </thead>
                            <tbody id="rep-historial"><tr><td colspan="5" class="text-center py-3 text-muted">Sin datos.</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui/alertas.js"></script>
    <script src="../js/ui/dom.js"></script>
    <script src="../js/ui/layout.js"></script>
    <script src="../js/paginas/reportes.js"></script>
</body>
</html>
