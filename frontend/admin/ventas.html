<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ventas | El Huilense</title>

    <!-- Bootstrap 5.3 CSS e Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/alertas.css">
</head>
<body class="bg-unity-layout">

    <!-- Header y menú lateral: los pinta js/ui/layout.js -->
    <header id="layout-cabecera"></header>

    <div class="container-fluid px-4 main-content-wrapper">
        <div class="row g-4">

            <aside id="layout-sidebar"></aside>

            <main class="col-lg-9 col-xl-10">
                <!-- BANNER DE ENCABEZADO -->
                <div class="unity-welcome-card bg-white p-4 rounded-4 shadow-sm border-0 mb-4 d-flex align-items-center justify-content-between flex-wrap gap-3">
                    <div>
                        <h3 class="font-serif fw-bold text-huilense mb-1">Ventas Registradas</h3>
                        <p class="text-muted mb-0 small">Consulta las ventas del último domingo y registra nuevas ventas por mesero.</p>
                    </div>
                    <div class="d-flex gap-2 flex-wrap">
                        <button class="btn btn-huilense px-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#modalVenta">
                            <i class="bi bi-plus-circle me-1"></i> Registrar Venta
                        </button>
                    </div>
                </div>

                <!-- VENTAS REGISTRADAS -->
                <div class="bg-white p-4 rounded-4 shadow-sm border-0 mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="font-serif fw-bold text-huilense mb-0 fs-6"><i class="bi bi-receipt me-2"></i>Ventas Registradas</h5>
                        <button class="btn btn-sm btn-link text-huilense fw-bold text-decoration-none" data-bs-toggle="modal" data-bs-target="#modalVenta">
                            + Añadir Venta
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Mesero</th>
                                    <th>Fecha</th>
                                    <th class="text-end">Total</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-ventas-cuerpo">
                                <tr><td colspan="3" class="text-center py-4 text-muted">No hay ventas en esta sesión.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalVenta" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header bg-huilense text-white px-4">
                    <h5 class="modal-title font-serif"><i class="bi bi-receipt text-gold me-2"></i>Registrar Venta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-venta" novalidate>
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="venta-mesero-id" class="form-label fw-semibold text-huilense">Mesero</label>
                            <select class="form-select" id="venta-mesero-id" required>
                                <option value="">Cargando meseros…</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="venta-fecha" class="form-label fw-semibold text-huilense">Fecha de Venta</label>
                            <input type="date" class="form-control" id="venta-fecha" required>
                        </div>
                        <div class="mb-3">
                            <label for="venta-total" class="form-label fw-semibold text-huilense">Total Vendido ($)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">$</span>
                                <input type="number" class="form-control" id="venta-total" min="0" step="500" placeholder="Ej. 180000" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light px-4">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-huilense">Guardar Venta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui/alertas.js"></script>
    <script src="../js/ui/dom.js"></script>
    <script src="../js/ui/layout.js"></script>
    <script src="../js/paginas/ventas.js"></script>
</body>
</html>
